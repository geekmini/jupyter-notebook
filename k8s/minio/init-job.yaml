apiVersion: batch/v1
kind: Job
metadata:
  name: minio-init
  namespace: airflow
  labels:
    app: minio
spec:
  ttlSecondsAfterFinished: 300  # Clean up job after 5 minutes
  template:
    metadata:
      labels:
        app: minio-init
    spec:
      restartPolicy: OnFailure
      containers:
        - name: minio-mc
          image: minio/mc:latest
          env:
            - name: MINIO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: airflow-secrets
                  key: minio-secret-key
          command:
            - /bin/sh
            - -c
            - |
              # Wait for MinIO to be ready
              echo "Waiting for MinIO to be ready..."
              until mc alias set local http://minio.airflow.svc.cluster.local:9000 minioadmin $MINIO_ROOT_PASSWORD; do
                echo "MinIO not ready yet, retrying in 5 seconds..."
                sleep 5
              done

              echo "Creating buckets..."
              mc mb --ignore-existing local/pdf-input
              mc mb --ignore-existing local/markdown-output
              mc mb --ignore-existing local/temp

              echo "Setting bucket policies..."
              mc anonymous set download local/pdf-input

              echo "Buckets created successfully!"
              mc ls local/
