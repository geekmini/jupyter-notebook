[project]
name = "jupyter-notebook"
version = "1.0.0"
description = "Jupyter notebook project"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31.0",
    "pymongo>=3.11.0",
    "pandas>=1.2.2",
    "textblob>=0.9.0",
    "pyminizip>=0.2.6",
    "bcrypt>=3.2.0",
    "beautifulsoup4>=4.10.0",
    "openpyxl>=3.0.7",
    "xlrd>=1.2.0",
    "emoji>=1.5.0",
    "matplotlib>=3.7.1",
    "pymupdf>=1.24.0",
]

[project.optional-dependencies]
dev = [
    "mock>=4.0.1",
    "mongomock>=3.19.0",
    "pytest>=5.4.1",
    "pytest-cov>=2.8.1",
    "pytest-watch>=4.2.0",
    "ruff>=0.8.0",
    "apache-airflow>=2.6.2",
    "boto3>=1.18.0",
    "bson>=0.5.10",
    "python-dotenv>=0.19.2",
    "notebook>=6.4.12",
]

[tool.ruff]
line-length = 120
target-version = "py312"

exclude = [
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".tox",
    ".venv",
    "_build",
    "buck-out",
    "build",
    "dist",
    "tests_data",
    "__pycache__",
    "notebooks",
    "examples",
    "node_modules",
    "python_package",
    "tmp-dev",
    "tmp_dev",
]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "UP",     # pyupgrade
]

ignore = [
    "E501",   # line too long (handled by formatter)
    "F401",   # imported but unused
    "E203",   # whitespace before ':'
]

[tool.ruff.lint.isort]
force-single-line = false
lines-after-imports = 2
known-first-party = ["src"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
reportMissingImports = false
reportMissingModuleSource = false
